name: E2E (browser)

# A REUSABLE workflow holding the single definition of the browser E2E job:
#
#   - called by CI (.github/workflows/ci.yml) on every push to main and every
#     pull request, where its result gates the Render deploy (needs:)
#   - scheduled weekly here as a soak against drift (asset rot, selector rot,
#     seeding) — scheduled workflows run only from the default branch and are
#     auto-disabled after 60 days without repo activity; re-enable from the
#     Actions tab if that happens
#
# The suite is self-contained: it boots its own Laravel server on :8010 with
# a throwaway sqlite database (tests/e2e), so it never touches other jobs.

on:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  playwright:
    name: E2E (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Laravel readiness (env, key, storage dirs)
        run: |
          mkdir -p storage/framework/cache storage/framework/data storage/framework/sessions storage/framework/testing storage/framework/views
          cp .env.example .env
          php artisan key:generate --force
          # No DB bootstrap here: the Playwright webServer command builds the
          # throwaway sqlite database itself (config comment explains why —
          # readiness is polled before globalSetup would ever run).

      - name: Install Playwright + Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite (boots its own server on :8010)
        working-directory: tests/e2e
        run: npx playwright test --reporter=line

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 7
