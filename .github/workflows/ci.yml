name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, exif, pdo_sqlite, sqlite3, intl, zip, bcmath, pcntl
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Create environment file
        run: |
          # Mirrors render.yaml envVars. Deliberate differences: sqlite DB
          # instead of Render Postgres, and safe stand-ins for dashboard-only
          # secrets (MAIL_* sync:false, generated API_TOKEN).
          CI_API_TOKEN=$(openssl rand -hex 20)
          printf 'APP_NAME=Nexsus\nAPP_ENV=production\nAPP_KEY=\nAPP_DEBUG=false\nAPP_URL=http://127.0.0.1:8000\nLOG_CHANNEL=stderr\nDB_CONNECTION=sqlite\nDB_DATABASE=%s/database/ci.sqlite\nSESSION_DRIVER=database\nCACHE_DRIVER=database\nQUEUE_CONNECTION=database\nALLOW_REGISTRATION=true\nADMIN_PASSWORD=ciAdminPassw0rd\nFORCE_HTTPS=false\nFORCE_ROUTE_HTTPS=false\nMANUAL_USER_VERIFICATION=false\nMAIL_MAILER=smtp\nMAIL_HOST=localhost\nMAIL_PORT=587\nMAIL_ENCRYPTION=tls\nMAIL_FROM_ADDRESS=nexsus@example.test\nMAIL_FROM_NAME=Nexsus\nAPI_TOKEN=%s\nREDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' "$GITHUB_WORKSPACE" "$CI_API_TOKEN" > .env
          # The sqlite file must exist BEFORE composer install: the
          # post-autoload-dump hook boots artisan, which opens the DB connection.
          touch database/ci.sqlite

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          find app routes config database/seeders database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Guard source encoding and rebrand artifacts
        run: |
          # Blade/PHP sources must be UTF-8 without a BOM. A UTF-16 login view
          # (PowerShell redirect artifact) silently disabled the login form.
          bad=$(find app routes config database resources/views resources/lang blocks themes \
                  -type f \( -name '*.php' -o -name '*.blade.php' \) -print0 \
                | xargs -0 file | grep -E 'UTF-16|with BOM' || true)
          if [ -n "$bad" ]; then echo "FAIL: non-UTF-8 source files:"; echo "$bad"; exit 1; fi

          # The rebrand produced literal "Nexsus Tracker" in filesystem paths,
          # view names and config keys. Those resolve to nothing at runtime
          # (500s / silently-disabled features), so fail the build on any.
          refs=$(grep -rnE "(assets/Nexsus Tracker/|(config|view|@include|@extends)\('Nexsus Tracker\.)" \
                   --include='*.php' --include='*.blade.php' \
                   app resources routes config database blocks themes || true)
          if [ -n "$refs" ]; then echo "FAIL: unresolvable 'Nexsus Tracker' paths/identifiers:"; echo "$refs"; exit 1; fi

      - name: Install Node dependencies and build assets
        run: |
          npm ci --no-audit --no-fund
          npm run production

      - name: Prepare SQLite database
        run: |
          php artisan key:generate --force --no-interaction
          php artisan migrate --force
          php artisan db:seed --force
          # Never config:cache this app: routes/middleware read env() directly,
          # which returns null once config is cached (upstream Nexsus Tracker design).

      - name: Verify baseline data and driver tables
        run: |
          php artisan tinker --execute="
            if (\App\Models\Page::count() < 1) { fwrite(STDERR, 'FAIL: no pages row'.PHP_EOL); exit(1); }
            if (\App\Models\User::count() < 1) { fwrite(STDERR, 'FAIL: no users row'.PHP_EOL); exit(1); }
            foreach (['sessions', 'cache', 'jobs', 'failed_jobs'] as \$t) {
              if (!Schema::hasTable(\$t)) { fwrite(STDERR, \"FAIL: missing table \$t\".PHP_EOL); exit(1); }
            }
            echo 'baseline OK'.PHP_EOL;
          "

      - name: Start server
        run: |
          php -S 127.0.0.1:8000 index.php > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null "http://127.0.0.1:8000/api/v1/health/live"; then break; fi
            sleep 1
          done

      - name: Smoke tests
        run: |
          base="http://127.0.0.1:8000"
          for path in "/" "/login" "/register" "/api/v1/health/live"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "GET $path -> $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: $path returned $code"
              exit 1
            fi
          done

      - name: Authenticated smoke (register, then dashboard)
        run: |
          base="http://127.0.0.1:8000"
          jar=$(mktemp)
          rnd=$RANDOM
          csrf=$(curl -s -c "$jar" "$base/register" | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          if [ -z "$csrf" ]; then echo "FAIL: no CSRF token on /register"; exit 1; fi
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/register" \
            --data-urlencode "_token=$csrf" \
            --data-urlencode "name=CI User" \
            --data-urlencode "handle=ciuser$rnd" \
            --data-urlencode "email=ciuser$rnd@example.test" \
            --data-urlencode "password=ciPassword1" \
            --data-urlencode "password_confirmation=ciPassword1")
          echo "POST /register -> $code (expect 302)"
          if [ "$code" != "302" ]; then echo "FAIL: registration did not auto-login"; exit 1; fi
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' "$base/dashboard")
          echo "GET /dashboard -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: authed dashboard broken (middleware/env class of bug)"; exit 1; fi

          # Logout, then log back in with the account just created. Login had
          # NO coverage before: the login view shipped UTF-16LE encoded, so
          # Blade emitted it verbatim (no <form>, no @csrf) and every login
          # POST failed CSRF. Registration auto-logins, so the old smoke chain
          # never exercised the login form at all.
          lcsrf=$(curl -s -b "$jar" -c "$jar" "$base/dashboard" | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          curl -s -b "$jar" -c "$jar" -o /dev/null -X POST "$base/logout" --data-urlencode "_token=$lcsrf"
          jar2=$(mktemp)
          loginpage=$(mktemp)
          curl -s -c "$jar2" -o "$loginpage" "$base/login"
          if ! grep -q '<form' "$loginpage"; then echo "FAIL: /login rendered no <form> (view encoding/compile bug)"; exit 1; fi
          csrf3=$(grep -o 'name="_token" value="[^"]*"' "$loginpage" | head -1 | sed 's/.*value="//;s/"//')
          if [ -z "$csrf3" ]; then echo "FAIL: no CSRF token on /login"; exit 1; fi
          code=$(curl -s -b "$jar2" -c "$jar2" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
            --data-urlencode "_token=$csrf3" \
            --data-urlencode "email=ciuser$rnd@example.test" \
            --data-urlencode "password=ciPassword1")
          echo "POST /login -> $code (expect 302)"
          code=$(curl -s -b "$jar2" -c "$jar2" -o /dev/null -w '%{http_code}' "$base/dashboard")
          echo "GET /dashboard after login -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: login does not work"; exit 1; fi
          jar="$jar2"

          # Full user flow: create a link, then verify it renders on the
          # share page. This is the exact chain that broke in production
          # four times (FK on empty buttons table, missing gitignored
          # favicon dir, EnvEditor .env requirement, root-owned dir).
          curl -s -b "$jar" -c "$jar" -o addlink.html "$base/studio/add-link"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$base/studio/add-link")
          echo "GET /studio/add-link -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: add-link page broken"; exit 1; fi
          csrf2=$(grep -o 'name="_token" value="[^"]*"' addlink.html | head -1 | sed 's/.*value="//;s/"//')
          if [ -z "$csrf2" ]; then echo "FAIL: no CSRF token on /studio/add-link"; exit 1; fi
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/studio/edit-link" \
            --data-urlencode "_token=$csrf2" \
            --data-urlencode "typename=link" \
            --data-urlencode "title=CI Link" \
            --data-urlencode "link=https://example.com/ci-$rnd" \
            --data-urlencode "GetSiteIcon=1")
          echo "POST /studio/edit-link -> $code (expect 302)"
          if [ "$code" != "302" ]; then echo "FAIL: link creation broken (FK/seeder class of bug)"; exit 1; fi
          code=$(curl -s -b "$jar" -o share.html -w '%{http_code}' "$base/@ciuser$rnd")
          echo "GET /@ciuser$rnd -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: share page broken (favicon/env-editor/permission class of bug)"; exit 1; fi
          if ! grep -q "CI Link" share.html; then echo "FAIL: created link not visible on share page"; exit 1; fi
          echo "full user flow OK: register -> dashboard -> create link -> share page"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs
          path: |
            storage/logs/*.log
            server.log
          if-no-files-found: ignore

  # Production runs Postgres on Render; the sqlite job above cannot catch
  # MySQL/SQLite-only SQL (e.g. loose GROUP BY, dialect functions). This job
  # mirrors the production database engine and runs the same build + smoke.
  build-and-smoke-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexsus_ci
          POSTGRES_USER: nexsus_ci
          POSTGRES_PASSWORD: nexsus_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexsus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, exif, pdo_pgsql, intl, zip, bcmath, pcntl
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Create environment file (Postgres, mirrors render.yaml)
        run: |
          CI_API_TOKEN=$(openssl rand -hex 20)
          printf 'APP_NAME=Nexsus\nAPP_ENV=production\nAPP_KEY=\nAPP_DEBUG=false\nAPP_URL=http://127.0.0.1:8000\nLOG_CHANNEL=stderr\nDB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=nexsus_ci\nDB_USERNAME=nexsus_ci\nDB_PASSWORD=nexsus_ci_pw\nSESSION_DRIVER=database\nCACHE_DRIVER=database\nQUEUE_CONNECTION=database\nALLOW_REGISTRATION=true\nADMIN_PASSWORD=ciAdminPassw0rd\nFORCE_HTTPS=false\nFORCE_ROUTE_HTTPS=false\nMANUAL_USER_VERIFICATION=false\nMAIL_MAILER=smtp\nMAIL_HOST=localhost\nMAIL_PORT=587\nMAIL_ENCRYPTION=tls\nMAIL_FROM_ADDRESS=nexsus@example.test\nMAIL_FROM_NAME=Nexsus\nAPI_TOKEN=%s\nREDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' "$CI_API_TOKEN" > .env

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          find app routes config database/seeders database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Guard source encoding and rebrand artifacts
        run: |
          # Blade/PHP sources must be UTF-8 without a BOM. A UTF-16 login view
          # (PowerShell redirect artifact) silently disabled the login form.
          bad=$(find app routes config database resources/views resources/lang blocks themes \
                  -type f \( -name '*.php' -o -name '*.blade.php' \) -print0 \
                | xargs -0 file | grep -E 'UTF-16|with BOM' || true)
          if [ -n "$bad" ]; then echo "FAIL: non-UTF-8 source files:"; echo "$bad"; exit 1; fi

          # The rebrand produced literal "Nexsus Tracker" in filesystem paths,
          # view names and config keys. Those resolve to nothing at runtime
          # (500s / silently-disabled features), so fail the build on any.
          refs=$(grep -rnE "(assets/Nexsus Tracker/|(config|view|@include|@extends)\('Nexsus Tracker\.)" \
                   --include='*.php' --include='*.blade.php' \
                   app resources routes config database blocks themes || true)
          if [ -n "$refs" ]; then echo "FAIL: unresolvable 'Nexsus Tracker' paths/identifiers:"; echo "$refs"; exit 1; fi

      - name: Install Node dependencies and build assets
        run: |
          npm ci --no-audit --no-fund
          npm run production

      - name: Migrate and seed Postgres
        run: |
          php artisan key:generate --force --no-interaction
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start server
        run: |
          php -S 127.0.0.1:8000 index.php > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null "http://127.0.0.1:8000/api/v1/health/live"; then break; fi
            sleep 1
          done

      - name: Smoke tests (Postgres)
        run: |
          base="http://127.0.0.1:8000"
          for path in "/" "/login" "/register" "/api/v1/health/live"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "GET $path -> $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: $path returned $code"
              exit 1
            fi
          done

      - name: Authenticated smoke (Postgres, register then dashboard)
        run: |
          base="http://127.0.0.1:8000"
          jar=$(mktemp)
          rnd=$RANDOM
          csrf=$(curl -s -c "$jar" "$base/register" | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          if [ -z "$csrf" ]; then echo "FAIL: no CSRF token on /register"; exit 1; fi
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/register" \
            --data-urlencode "_token=$csrf" \
            --data-urlencode "name=CI User" \
            --data-urlencode "handle=ciuser$rnd" \
            --data-urlencode "email=ciuser$rnd@example.test" \
            --data-urlencode "password=ciPassword1" \
            --data-urlencode "password_confirmation=ciPassword1")
          echo "POST /register -> $code (expect 302)"
          if [ "$code" != "302" ]; then echo "FAIL: registration did not auto-login"; exit 1; fi
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' "$base/dashboard")
          echo "GET /dashboard -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: authed dashboard broken (middleware/env class of bug)"; exit 1; fi

          # Logout, then log back in with the account just created. Login had
          # NO coverage before: the login view shipped UTF-16LE encoded, so
          # Blade emitted it verbatim (no <form>, no @csrf) and every login
          # POST failed CSRF. Registration auto-logins, so the old smoke chain
          # never exercised the login form at all.
          lcsrf=$(curl -s -b "$jar" -c "$jar" "$base/dashboard" | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          curl -s -b "$jar" -c "$jar" -o /dev/null -X POST "$base/logout" --data-urlencode "_token=$lcsrf"
          jar2=$(mktemp)
          loginpage=$(mktemp)
          curl -s -c "$jar2" -o "$loginpage" "$base/login"
          if ! grep -q '<form' "$loginpage"; then echo "FAIL: /login rendered no <form> (view encoding/compile bug)"; exit 1; fi
          csrf3=$(grep -o 'name="_token" value="[^"]*"' "$loginpage" | head -1 | sed 's/.*value="//;s/"//')
          if [ -z "$csrf3" ]; then echo "FAIL: no CSRF token on /login"; exit 1; fi
          code=$(curl -s -b "$jar2" -c "$jar2" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
            --data-urlencode "_token=$csrf3" \
            --data-urlencode "email=ciuser$rnd@example.test" \
            --data-urlencode "password=ciPassword1")
          echo "POST /login -> $code (expect 302)"
          code=$(curl -s -b "$jar2" -c "$jar2" -o /dev/null -w '%{http_code}' "$base/dashboard")
          echo "GET /dashboard after login -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: login does not work"; exit 1; fi
          jar="$jar2"

          # Full user flow: create a link, then verify it renders on the
          # share page. This is the exact chain that broke in production
          # four times (FK on empty buttons table, missing gitignored
          # favicon dir, EnvEditor .env requirement, root-owned dir).
          curl -s -b "$jar" -c "$jar" -o addlink.html "$base/studio/add-link"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$base/studio/add-link")
          echo "GET /studio/add-link -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: add-link page broken"; exit 1; fi
          csrf2=$(grep -o 'name="_token" value="[^"]*"' addlink.html | head -1 | sed 's/.*value="//;s/"//')
          if [ -z "$csrf2" ]; then echo "FAIL: no CSRF token on /studio/add-link"; exit 1; fi
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/studio/edit-link" \
            --data-urlencode "_token=$csrf2" \
            --data-urlencode "typename=link" \
            --data-urlencode "title=CI Link" \
            --data-urlencode "link=https://example.com/ci-$rnd" \
            --data-urlencode "GetSiteIcon=1")
          echo "POST /studio/edit-link -> $code (expect 302)"
          if [ "$code" != "302" ]; then echo "FAIL: link creation broken (FK/seeder class of bug)"; exit 1; fi
          code=$(curl -s -b "$jar" -o share.html -w '%{http_code}' "$base/@ciuser$rnd")
          echo "GET /@ciuser$rnd -> $code (expect 200)"
          if [ "$code" != "200" ]; then echo "FAIL: share page broken (favicon/env-editor/permission class of bug)"; exit 1; fi
          if ! grep -q "CI Link" share.html; then echo "FAIL: created link not visible on share page"; exit 1; fi
          echo "full user flow OK: register -> dashboard -> create link -> share page"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs-postgres
          path: |
            storage/logs/*.log
            server.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Deploy gate.
  #
  # Render was configured with autoDeploy:true, so EVERY push to main shipped
  # regardless of CI. CI was red for 8 consecutive runs on a migration that
  # aborted mid-chain, and each of those runs still deployed — which is how
  # production ended up on a permanently half-migrated schema.
  #
  # render.yaml now sets autoDeploy:false and the deploy is triggered here
  # instead, so it can only happen after BOTH test jobs pass.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Browser E2E. Deliberately defined HERE and not as a reusable workflow:
  # required status checks need a stable context name, and called workflows
  # report "<parent> / <job>", which changes per trigger. Keep this job in
  # sync with .github/workflows/e2e.yml (same suite, weekly cron + dispatch).
  # ---------------------------------------------------------------------------
  playwright:
    name: E2E (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Laravel readiness (env, key, storage dirs)
        run: |
          mkdir -p storage/framework/cache storage/framework/data storage/framework/sessions storage/framework/testing storage/framework/views
          cp .env.example .env
          php artisan key:generate --force
          # No DB bootstrap here: the Playwright webServer command builds the
          # throwaway sqlite database itself (config comment explains why —
          # readiness is polled before globalSetup would ever run).

      - name: Install Playwright + Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite (boots its own server on :8010)
        working-directory: tests/e2e
        run: npx playwright test --reporter=line

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Render
    needs: [build-and-smoke, build-and-smoke-postgres, playwright]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false

    steps:
      - name: Trigger Render deploy (API)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY / RENDER_SERVICE_ID are not set, so nothing was deployed."
            echo "Tests passed — this step only gates the deploy. Add both under"
            echo "GitHub -> Settings -> Secrets and variables -> Actions."
            echo "Until then, deploy manually from the Render dashboard."
            exit 1
          fi

          # Render's API trigger deploys the service's configured branch (main)
          # and works even though this service exposes no deploy-hook URL.
          http=$(curl -sS -X POST -o /tmp/render-response -w '%{http_code}' \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          echo "Render deploy trigger responded $http"
          cat /tmp/render-response 2>/dev/null || true
          echo
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "::error::Render deploy trigger failed with HTTP $http"
            exit 1
          fi
          dep=$(php -r 'echo json_decode(file_get_contents("/tmp/render-response"),true)["id"] ?? "";')
          echo "deploy_id=$dep"
          echo "Deploy triggered. Watch it in the Render dashboard."
