name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, exif, pdo_sqlite, sqlite3, intl, zip, bcmath, pcntl
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Create environment file
        run: |
          # Mirrors render.yaml envVars. Deliberate differences: sqlite DB
          # instead of Render Postgres, and safe stand-ins for dashboard-only
          # secrets (MAIL_* sync:false, generated API_TOKEN).
          CI_API_TOKEN=$(openssl rand -hex 20)
          printf 'APP_NAME=Nexsus\nAPP_ENV=production\nAPP_KEY=\nAPP_DEBUG=false\nAPP_URL=http://127.0.0.1:8000\nLOG_CHANNEL=stderr\nDB_CONNECTION=sqlite\nDB_DATABASE=%s/database/ci.sqlite\nSESSION_DRIVER=database\nCACHE_DRIVER=database\nQUEUE_CONNECTION=database\nALLOW_REGISTRATION=true\nFORCE_HTTPS=false\nFORCE_ROUTE_HTTPS=false\nMANUAL_USER_VERIFICATION=false\nMAIL_MAILER=smtp\nMAIL_HOST=localhost\nMAIL_PORT=587\nMAIL_ENCRYPTION=tls\nMAIL_FROM_ADDRESS=nexsus@example.test\nMAIL_FROM_NAME=Nexsus\nAPI_TOKEN=%s\nREDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' "$GITHUB_WORKSPACE" "$CI_API_TOKEN" > .env
          # The sqlite file must exist BEFORE composer install: the
          # post-autoload-dump hook boots artisan, which opens the DB connection.
          touch database/ci.sqlite

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          find app routes config database/seeders database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Node dependencies and build assets
        run: |
          npm ci --no-audit --no-fund
          npm run production

      - name: Prepare SQLite database
        run: |
          php artisan key:generate --force --no-interaction
          php artisan migrate --force
          php artisan db:seed --force
          # Never config:cache this app: routes/middleware read env() directly,
          # which returns null once config is cached (upstream LinkStack design).

      - name: Verify baseline data and driver tables
        run: |
          php artisan tinker --execute="
            if (\App\Models\Page::count() < 1) { fwrite(STDERR, 'FAIL: no pages row'.PHP_EOL); exit(1); }
            if (\App\Models\User::count() < 1) { fwrite(STDERR, 'FAIL: no users row'.PHP_EOL); exit(1); }
            foreach (['sessions', 'cache', 'jobs', 'failed_jobs'] as \$t) {
              if (!Schema::hasTable(\$t)) { fwrite(STDERR, \"FAIL: missing table \$t\".PHP_EOL); exit(1); }
            }
            echo 'baseline OK'.PHP_EOL;
          "

      - name: Start server
        run: |
          php -S 127.0.0.1:8000 index.php > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null "http://127.0.0.1:8000/api/v1/health/live"; then break; fi
            sleep 1
          done

      - name: Smoke tests
        run: |
          base="http://127.0.0.1:8000"
          for path in "/" "/login" "/register" "/api/v1/health/live"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "GET $path -> $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: $path returned $code"
              exit 1
            fi
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs
          path: |
            storage/logs/*.log
            server.log
          if-no-files-found: ignore

  # Production runs Postgres on Render; the sqlite job above cannot catch
  # MySQL/SQLite-only SQL (e.g. loose GROUP BY, dialect functions). This job  # mirrors the production database engine and runs the same build + smoke.
  build-and-smoke-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexsus_ci
          POSTGRES_USER: nexsus_ci
          POSTGRES_PASSWORD: nexsus_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexsus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, exif, pdo_pgsql, intl, zip, bcmath, pcntl
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Create environment file (Postgres, mirrors render.yaml)
        run: |
          CI_API_TOKEN=$(openssl rand -hex 20)
          printf 'APP_NAME=Nexsus\nAPP_ENV=production\nAPP_KEY=\nAPP_DEBUG=false\nAPP_URL=http://127.0.0.1:8000\nLOG_CHANNEL=stderr\nDB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=nexsus_ci\nDB_USERNAME=nexsus_ci\nDB_PASSWORD=nexsus_ci_pw\nSESSION_DRIVER=database\nCACHE_DRIVER=database\nQUEUE_CONNECTION=database\nALLOW_REGISTRATION=true\nFORCE_HTTPS=false\nFORCE_ROUTE_HTTPS=false\nMANUAL_USER_VERIFICATION=false\nMAIL_MAILER=smtp\nMAIL_HOST=localhost\nMAIL_PORT=587\nMAIL_ENCRYPTION=tls\nMAIL_FROM_ADDRESS=nexsus@example.test\nMAIL_FROM_NAME=Nexsus\nAPI_TOKEN=%s\nREDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' "$CI_API_TOKEN" > .env

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          find app routes config database/seeders database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Node dependencies and build assets
        run: |
          npm ci --no-audit --no-fund
          npm run production

      - name: Migrate and seed Postgres
        run: |
          php artisan key:generate --force --no-interaction
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start server
        run: |
          php -S 127.0.0.1:8000 index.php > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null "http://127.0.0.1:8000/api/v1/health/live"; then break; fi
            sleep 1
          done

      - name: Smoke tests (Postgres)
        run: |
          base="http://127.0.0.1:8000"
          for path in "/" "/login" "/register" "/api/v1/health/live"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "GET $path -> $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: $path returned $code"
              exit 1
            fi
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs-postgres
          path: |
            storage/logs/*.log
            server.log
          if-no-files-found: ignore
