# Single-container setup: nginx and php-fpm run side by side under supervisord.
# This app's front controller is /index.php at the repository root (upstream
# Nexsus Tracker layout), not /public/index.php.
# Runs as www-data: main-level error/access logs go to stderr/stdout (rewritten
# in the Dockerfile); temp dirs live under /run/nginx which is pre-created and
# chowned in the Dockerfile.
client_body_temp_path /run/nginx/client_body;
proxy_temp_path /run/nginx/proxy;
fastcgi_temp_path /run/nginx/fastcgi;
uwsgi_temp_path /run/nginx/uwsgi;
scgi_temp_path /run/nginx/scgi;

server {
    # Exactly ONE listen directive: the entrypoint rewrites its port from
    # $PORT at boot (Render). A second listen line would become a duplicate
    # after the rewrite and crash nginx ([emerg] duplicate listen).
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    access_log /dev/stdout;
    error_log /dev/stderr;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only the front controller may be executed. Because this app's docroot
    # IS the repository root, every .php file in the tree (app/, config/,
    # database/, vendor/, blocks/*/handler.php, artisan) sits under the
    # docroot. The .htaccess shipped for Apache enforces exactly this
    # ("RewriteCond %{REQUEST_URI} !^/index\.php$ / RewriteRule \.php$ - [F,L]")
    # but nginx had no equivalent, so those files were directly reachable --
    # served as plaintext source when not matched by a fastcgi rule, or
    # executed out of context when they were.
    #
    # An exact-match (=) location outranks the regex location below, so
    # /index.php executes and every other .php is refused.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }

    # Deny access to hidden files (.env, .git, .htaccess, ...)
    location ~ /\. {
        deny all;
    }

    # Sensitive file types anywhere in the tree. Mirrors the .htaccess
    # FilesMatch/RewriteRule blocks: application logs leak stack traces and
    # bound SQL parameters, and a sqlite DB_DATABASE under the docroot would
    # otherwise be downloadable in full.
    location ~* \.(log|sqlite|sqlite3|db|zip|sh|lock|yml|yaml|ini)$ {
        deny all;
    }

    # Directories that never serve anything directly. resources/ and vendor/
    # are deliberately NOT blanket-denied: resources/ckeditor/ckeditor.js and
    # vendor/livewire/livewire/dist/livewire.js are loaded by the frontend.
    location ~ ^/(storage|database|bootstrap|tests|docker|\.github)/ {
        deny all;
    }

    # Root-level project metadata and documentation. These are read by the app
    # via base_path()/file_get_contents and are never fetched over HTTP, but
    # they were all publicly downloadable: AGENTS.md documented the seeded
    # admin credentials, USER_DATA.md the full database schema, and
    # composer.json/package.json the exact dependency versions.
    location ~ ^/[^/]+\.(md|json|xml|config|lock|yml|yaml)$ {
        deny all;
    }

    # Extensionless PHP entrypoint at the repository root.
    location = /artisan {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

}
