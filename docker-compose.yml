version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexsus-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_TOKEN=${API_TOKEN:-}
      - GA4_ID=${GA4_ID:-}
      - GTM_ID=${GTM_ID:-}
    depends_on:
      redis:
        condition: service_started
    networks:
      - nexsus-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: nexsus-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx-compose.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nexsus-network

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: nexsus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    networks:
      - nexsus-network

  # Queue Worker (for webhooks)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexsus-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - nexsus-network

  # Scheduler (optional)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexsus-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &;
        sleep 60;
      done"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    depends_on:
      app:
        condition: service_started
    networks:
      - nexsus-network

volumes:
  redis:

networks:
  nexsus-network:
    driver: bridge
