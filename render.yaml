services:
  - type: web
    name: nexsus-link-tracker
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: APP_NAME
        value: Nexsus
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          name: nexsus-link-tracker
          type: web
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: nexsus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexsus-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nexsus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexsus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexsus-db
          property: password
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"
      - key: API_TOKEN
        generateValue: true
      - key: MANUAL_USER_VERIFICATION
        value: "false"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: REDIS_HOST
        value: "127.0.0.1"
      - key: REDIS_PORT
        value: "6379"

databases:
  - name: nexsus-db
    plan: free
    databaseName: nexsus
    user: nexsus_user