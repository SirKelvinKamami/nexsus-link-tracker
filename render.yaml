services:
  - type: web
    name: nexsus-link-tracker
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_NAME
        value: Nexsus
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      # Set this to your Render URL (e.g. https://nexsus-link-tracker.onrender.com) on first deploy
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: nexsus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexsus-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nexsus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexsus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexsus-db
          property: password
      # Drivers: the database has no sessions/cache/jobs tables, so use
      # file-based sessions/cache and the sync queue until those migrations exist
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"
      - key: API_TOKEN
        generateValue: true
      - key: MANUAL_USER_VERIFICATION
        value: "false"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: FORCE_HTTPS
        value: "true"

databases:
  - name: nexsus-db
    plan: free
    databaseName: nexsus
    user: nexsus_user
