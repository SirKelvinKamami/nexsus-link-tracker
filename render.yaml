services:
  - type: web
    name: nexsus-link-tracker
    env: docker
    dockerfilePath: ./Dockerfile
    # Deploys are gated on CI, not on the push itself. With autoDeploy:true
    # every push to main shipped whether or not the test suite passed — CI was
    # red for 8 consecutive runs on a migration that aborted partway through
    # the chain, and all 8 deployed anyway, leaving production on a
    # permanently half-migrated schema.
    #
    # The `deploy` job in .github/workflows/ci.yml now POSTs this service's
    # deploy hook, and it only runs after both test jobs pass. It needs the
    # RENDER_DEPLOY_HOOK_URL repository secret (the job prints setup steps if
    # it is missing).
    #
    # NOTE: this field only takes effect when Render re-syncs the blueprint.
    # The dashboard toggle (Settings -> Build & Deploy -> Auto-Deploy) is
    # authoritative — confirm it reads "No" after merging.
    autoDeploy: false
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_NAME
        value: Nexsus
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # generateValue produces a raw string WITHOUT Laravel's "base64:"
      # prefix -> "Unsupported cipher" 500s on every page. The key is managed
      # in the dashboard (set via API) and left untouched by blueprint syncs.
      - key: APP_KEY
        sync: false
      # fromService property: host resolved to the bare service name, not the
      # FQDN — pin the public URL explicitly instead.
      - key: APP_URL
        value: https://nexsus-link-tracker.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      # NOTE: on the free Postgres plan private networking is unavailable —
      # property: host resolves to the internal "dpg-...-a" hostname which
      # does not resolve from web services. External hostname is required:
      - key: DB_HOST
        value: dpg-dalgunu7bikc7389rh50-a.oregon-postgres.render.com
      - key: DB_PORT
        fromDatabase:
          name: nexsus-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nexsus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexsus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexsus-db
          property: password
      # Drivers: sessions/cache/jobs tables are created by the
      # 2024_01_08_* migrations, so the database drivers are safe here
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      # DANGER: Laravel's pgsql/sqlite connections let DATABASE_URL override
      # DB_HOST/DB_PORT/DB_DATABASE entirely. fromDatabase:connectionString
      # resolves to the INTERNAL hostname (dpg-...-a), which does not resolve
      # on the free Postgres plan -> boot migrations fatal and the deploy
      # fails. The DB_* vars above (external FQDN) are the single source of
      # truth; DATABASE_URL must NOT be set.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: nexsus-db
      #     property: connectionString
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: info
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: API_TOKEN
        generateValue: true
      - key: MANUAL_USER_VERIFICATION
        value: "false"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: FORCE_HTTPS
        value: "false"
      - key: FORCE_ROUTE_HTTPS
        value: "false"
      - key: REDIS_HOST
        value: "127.0.0.1"
      - key: REDIS_PORT
        value: "6379"

databases:
  - name: nexsus-db
    plan: free
    databaseName: nexsus
    user: nexsus_user
