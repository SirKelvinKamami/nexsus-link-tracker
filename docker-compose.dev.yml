version: '3.8'

services:
  # Development App
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nexsus-dev-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-}
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - API_TOKEN=${API_TOKEN:-}
      - GA4_ID=${GA4_ID:-}
      - GTM_ID=${GTM_ID:-}
    networks:
      - nexsus-dev-network

  # Development Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nexsus-dev-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    depends_on:
      - app
    networks:
      - nexsus-dev-network

networks:
  nexsus-dev-network:
    driver: bridge
